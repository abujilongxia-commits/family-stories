<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭故事集</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }
        
        .header a {
            color: white;
            text-decoration: none;
            font-size: 0.85em;
            opacity: 0.9;
        }
        
        .header h1 {
            font-size: 1.4em;
            margin-top: 8px;
        }
        
        .story { padding: 15px; }
        
        .scene {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .scene:last-child { border-bottom: none; }
        
        .scene-img {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        
        .scene-img img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .scene-text { display: flex; flex-direction: column; gap: 8px; }
        
        .narration { color: #555; font-size: 0.9em; line-height: 1.6; }
        
        .dialogue {
            background: #f5f5f5;
            padding: 10px 14px;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }
        
        .dialogue.speaker-father { border-left-color: #3498db; }
        .dialogue.speaker-mother { border-left-color: #e74c3c; }
        .dialogue.speaker-brother { border-left-color: #9b59b6; }
        .dialogue.speaker-brother2 { border-left-color: #f39c12; }
        
        .dialogue .name {
            font-weight: bold;
            font-size: 0.8em;
            color: #667eea;
            margin-bottom: 3px;
        }
        
        .dialogue .text { color: #333; font-size: 0.9em; line-height: 1.5; }
        
        .footer { text-align: center; padding: 15px; background: #f8f9fa; }
        
        .footer a {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 25px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9em;
        }
        
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 95%; max-height: 95%; border-radius: 8px; }
        .lightbox-close {
            position: absolute;
            top: 15px;
            right: 20px;
            color: white;
            font-size: 35px;
            cursor: pointer;
        }
        
        @media (max-width: 500px) {
            body { padding: 8px; }
            .header h1 { font-size: 1.2em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html">← 返回目錄</a>
            <h1 id="title">家庭故事集</h1>
        </div>
        <div class="story" id="story">
            <p style="text-align:center;padding:40px;color:#666;">載入中...</p>
        </div>
        <div class="footer">
            <a href="index.html">🏠 返回目錄</a>
        </div>
    </div>
    
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close">&times;</span>
        <img src="" alt="">
    </div>
    
    <script>
        const titles = {
            1: '說走就走？先問媽媽！', 2: '媽祖婆，我們來了！', 3: '守護家人的智慧生活',
            4: '春節團圓', 5: '棒球場攻略！', 6: '水彈槍大戰！',
            7: '魔術方塊高手！', 8: '小老師棉花糖！', 9: '居家大改造！'
        };
        
        const speakerClass = {
            '爸爸': 'speaker-father', '媽媽': 'speaker-mother',
            '阿布吉': 'speaker-brother', '棉花糖': 'speaker-brother2', '哥哥': 'speaker-brother'
        };
        
        let config = {};
        let storyDoc = null;
        
        async function init() {
            try { config = await (await fetch('./config.json')).json(); } catch(e) {}
            const id = new URLSearchParams(location.search).get('episode');
            if(id) loadEpisode(parseInt(id));
        }
        
        async function loadEpisode(id) {
            try {
                document.getElementById('title').textContent = titles[id] || `第${id}集`;
                document.title = (titles[id] || `第${id}集`) + ' - 家庭故事集';
                
                // 讀取故事原文
                const res = await fetch(`../episode${id}/story.html`);
                const html = await res.text();
                storyDoc = new DOMParser().parseFromString(html, 'text/html');
                
                // 選擇的圖片
                const images = config.selectedImages?.[`episode${id}`] || [];
                
                // 根據圖片產生匹配的故事
                const content = buildFromImages(images, id);
                document.getElementById('story').innerHTML = content;
                
                // 燈箱
                document.querySelectorAll('.scene-img').forEach(div => {
                    div.onclick = () => {
                        document.querySelector('#lightbox img').src = div.querySelector('img').src;
                        document.getElementById('lightbox').classList.add('active');
                    };
                });
            } catch(e) {
                document.getElementById('story').innerHTML = `<p style="text-align:center;padding:40px;">載入失敗：${e.message}</p>`;
            }
        }
        
        // 從圖片建立故事
        function buildFromImages(images, episodeId) {
            if (!storyDoc || images.length === 0) {
                return '<p style="text-align:center;padding:40px;">沒有圖片</p>';
            }
            
            let html = '';
            
            // 取得所有對話
            const allDialogues = [];
            storyDoc.querySelectorAll('.scene').forEach(scene => {
                const dialogues = scene.querySelectorAll('.dialogue');
                dialogues.forEach(d => {
                    const name = d.querySelector('strong')?.textContent?.trim() || '';
                    const text = d.querySelector('.text')?.textContent?.trim() || d.textContent?.trim() || '';
                    if (text) allDialogues.push({ name, text });
                });
                
                // 敘述
                scene.querySelectorAll('p').forEach(p => {
                    if (!p.querySelector('.dialogue') && p.textContent.trim()) {
                        allDialogues.push({ name: '', text: p.textContent.trim() });
                    }
                });
            });
            
            // 為每張圖片找最匹配的對話
            images.forEach((imgPath, idx) => {
                // 從檔名取出關鍵字
                const filename = imgPath.split('/').pop().replace('.jpg', ''); // "02_爸爸解說"
                const keywords = filename.split('_').pop(); // "爸爸解說"
                const numMatch = filename.match(/^(\d+)/); // "02"
                
                // 找相關對話
                const matched = findMatchingDialogues(allDialogues, keywords, numMatch?.[1]);
                
                // 組合成場景
                let sceneHtml = '';
                
                // 圖片
                sceneHtml += `<div class="scene-img"><img src="${imgPath}" loading="lazy" alt=""></div>`;
                sceneHtml += '<div class="scene-text">';
                
                // 敘述+對話
                matched.forEach(m => {
                    if (m.name) {
                        const cls = speakerClass[m.name] || '';
                        sceneHtml += `<div class="dialogue ${cls}"><div class="name">${m.name}</div><div class="text">${m.text}</div></div>`;
                    } else {
                        sceneHtml += `<p class="narration">${m.text}</p>`;
                    }
                });
                
                sceneHtml += '</div>';
                
                html += `<div class="scene">${sceneHtml}</div>`;
            });
            
            return html || '<p style="text-align:center;padding:40px;">沒有內容</p>';
        }
        
        // 找匹配的對話
        function findMatchingDialogues(allDialogues, keywords, sceneNum) {
            const kw = keywords.toLowerCase();
            const results = [];
            
            // 嘗試找相關的
            const relevant = allDialogues.filter(d => {
                if (!d.name && !d.text) return false;
                const searchText = (d.name + d.text).toLowerCase();
                
                // 精確關鍵字匹配
                if (kw.includes('爸爸') && searchText.includes('爸爸')) return true;
                if (kw.includes('媽媽') && searchText.includes('媽媽')) return true;
                if (kw.includes('阿布吉') && (searchText.includes('阿布吉') || searchText.includes('哥哥'))) return true;
                if (kw.includes('棉花糖') && (searchText.includes('棉花糖') || searchText.includes('弟弟'))) return true;
                if (kw.includes('擔心') && searchText.includes('擔心')) return true;
                if (kw.includes('解說') && searchText.includes('說')) return true;
                if (kw.includes('戰鬥') && searchText.includes('戰')) return true;
                if (kw.includes('攻擊') && searchText.includes('攻')) return true;
                if (kw.includes('反擊') && searchText.includes('反')) return true;
                if (kw.includes('結束') && searchText.includes('結')) return true;
                if (kw.includes('回家') && searchText.includes('回')) return true;
                
                return false;
            });
            
            if (relevant.length > 0) {
                // 取前面2-3個相關對話
                return relevant.slice(0, 3);
            }
            
            // 沒找到相關的，取最接近的幾個
            return allDialogues.slice(0, 2);
        }
        
        document.querySelector('.lightbox-close').onclick = () => document.getElementById('lightbox').classList.remove('active');
        document.getElementById('lightbox').onclick = e => { if(e.target.id==='lightbox') document.getElementById('lightbox').classList.remove('active'); };
        
        init();
    </script>
</body>
</html>
