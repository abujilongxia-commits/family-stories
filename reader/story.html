<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭故事集</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; background: white; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px 20px; text-align: center; }
        .header a { color: white; text-decoration: none; display: inline-block; margin-bottom: 10px; }
        .header h1 { font-size: 1.8em; margin-bottom: 5px; }
        .story-content { padding: 20px; }
        
        .panel { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; align-items: flex-start; }
        .panel:nth-child(even) { flex-direction: row-reverse; }
        .panel-img { flex: 1; min-width: 250px; max-width: 380px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .panel-img img { width: 100%; height: auto; display: block; cursor: pointer; }
        .panel-text { flex: 1; min-width: 200px; }
        
        .dialogue { background: #f5f5f5; padding: 12px 15px; border-radius: 10px; margin-bottom: 10px; border-left: 3px solid #667eea; }
        .dialogue strong { color: #667eea; display: block; margin-bottom: 3px; font-size: 0.9em; }
        .dialogue-text { color: #444; font-size: 0.95em; }
        .narration { color: #666; font-size: 0.9em; margin-bottom: 8px; }
        
        .section-title { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; text-align: center; margin: 30px 0 20px; border-radius: 10px; }
        .section-title h2 { font-size: 1.2em; }
        
        .back-button { display: block; text-align: center; padding: 20px; }
        .back-button a { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px 30px; border-radius: 25px; text-decoration: none; }
        
        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 95%; max-height: 95%; border-radius: 10px; }
        .lightbox-close { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; cursor: pointer; }
        
        @media (max-width: 600px) {
            .panel { flex-direction: column !important; }
            .panel-img, .panel-text { max-width: 100% !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html">← 返回目錄</a>
            <div id="episodeTag">🎬</div>
            <h1 id="episodeTitle">家庭故事集</h1>
        </div>
        <div class="story-content" id="storyContent">
            <p style="text-align: center; padding: 40px;">載入中...</p>
        </div>
        <div class="back-button">
            <a href="index.html">🏠 返回目錄</a>
        </div>
    </div>
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close">&times;</span>
        <img src="" alt="">
    </div>
    <script>
        const titles = {
            1: '說走就走？先問媽媽！', 2: '媽祖婆，我們來了！', 3: '守護家人的智慧生活',
            4: '春節團圓', 5: '棒球場攻略！', 6: '水彈槍大戰！',
            7: '魔術方塊高手！', 8: '小老師棉花糖！', 9: '居家大改造！'
        };
        
        let config = {};
        
        async function init() {
            try { config = await (await fetch('./config.json')).json(); } catch(e) {}
            const id = new URLSearchParams(location.search).get('episode');
            if(id) loadEpisode(parseInt(id));
        }
        
        async function loadEpisode(id) {
            try {
                const res = await fetch(`../episode${id}/story.html`);
                const html = await res.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                
                document.getElementById('episodeTag').textContent = `🎬 第${id}集`;
                document.getElementById('episodeTitle').textContent = titles[id] || `第${id}集`;
                document.title = titles[id] + ' - 家庭故事集';
                
                const images = config.selectedImages?.[`episode${id}`] || [];
                const content = processStory(doc, images);
                document.getElementById('storyContent').innerHTML = content;
                
                // 燈箱
                document.querySelectorAll('.panel-img img').forEach(img => {
                    img.onclick = () => { document.getElementById('lightbox').querySelector('img').src = img.src; document.getElementById('lightbox').classList.add('active'); };
                });
                document.querySelector('.lightbox-close').onclick = () => document.getElementById('lightbox').classList.remove('active');
                document.getElementById('lightbox').onclick = e => { if(e.target.id==='lightbox') document.getElementById('lightbox').classList.remove('active'); };
                
            } catch(e) {
                document.getElementById('storyContent').innerHTML = `<p style="text-align:center;padding:40px;">載入失敗：${e.message}</p>`;
            }
        }
        
        function processStory(doc, images) {
            let result = '';
            let imgIdx = 0;
            
            // 取得所有場景
            const scenes = doc.querySelectorAll('.scene');
            
            scenes.forEach((scene, i) => {
                // 對話
                let text = '';
                scene.querySelectorAll('.dialogue').forEach(d => {
                    const name = d.querySelector('strong')?.textContent || '';
                    const txt = d.querySelector('.text')?.textContent || d.textContent;
                    text += `<div class="dialogue"><strong>${name}</strong><div class="dialogue-text">${txt}</div></div>`;
                });
                
                // 敘述
                scene.querySelectorAll('p').forEach(p => {
                    if(!p.querySelector('.dialogue') && p.textContent.trim()) {
                        text += `<p class="narration">${p.textContent.trim()}</p>`;
                    }
                });
                
                // 圖片
                let imgHtml = '';
                if(imgIdx < images.length) {
                    imgHtml = `<div class="panel-img"><img src="${images[imgIdx]}" loading="lazy" alt=""></div>`;
                    imgIdx++;
                }
                
                // 有內容才顯示
                if(imgHtml || text) {
                    result += `<div class="panel">${imgHtml}<div class="panel-text">${text}</div></div>`;
                }
            });
            
            return result || '<p style="text-align:center;padding:40px;">沒有內容</p>';
        }
        
        init();
    </script>
</body>
</html>
