<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭故事集 - 閱讀中</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0;
            line-height: 1.8;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 60px rgba(0,0,0,0.3);
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 30px;
            text-align: center;
            position: relative;
        }
        
        .header .episode-tag {
            display: inline-block;
            background: rgba(255,255,255,0.3);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.9em;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header .subtitle {
            font-size: 1.1em;
            opacity: 0.95;
        }
        
        .story-content {
            padding: 40px 30px;
        }
        
        .scene {
            margin-bottom: 50px;
            page-break-inside: avoid;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.6s ease forwards;
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .scene-image {
            margin-bottom: 25px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            position: relative;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        
        .scene-image img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
        }
        
        .scene-image:hover img {
            transform: scale(1.02);
        }
        
        .scene-image .placeholder {
            width: 100%;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #95a5a6;
            font-size: 1.2em;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        
        .scene-number-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(102, 126, 234, 0.95);
            color: white;
            width: 45px;
            height: 45px;
            line-height: 45px;
            text-align: center;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1.1em;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }
        
        .scene-text {
            padding: 0 10px;
        }
        
        .scene-text p {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 15px;
            text-align: justify;
            line-height: 1.8;
        }
        
        .scene-text .dialogue {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px 25px;
            border-radius: 15px;
            margin: 20px 0;
            border-left: 5px solid #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        
        .scene-text .dialogue strong {
            color: #667eea;
            display: block;
            margin-bottom: 8px;
            font-size: 0.95em;
            font-weight: 600;
        }
        
        .scene-text .dialogue .text {
            color: #555;
            font-size: 1.05em;
            line-height: 1.6;
        }
        
        .part-divider {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            margin: 40px -30px;
            border-radius: 0;
        }
        
        .part-divider h2 {
            font-size: 1.8em;
            margin-bottom: 10px;
        }
        
        .part-divider p {
            opacity: 0.9;
            font-size: 1em;
        }
        
        .footer {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 30px;
            text-align: center;
            margin-top: 50px;
        }
        
        .footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            padding: 12px 30px;
            background: white;
            border-radius: 30px;
            display: inline-block;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        
        .footer a:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        
        /* 載入進度條 */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(0,0,0,0.1);
            z-index: 9999;
        }
        
        .progress-bar .progress {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .progress-bar.hidden {
            display: none;
        }
        
        /* 返回按鈕 */
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: white;
            color: #667eea;
            width: 50px;
            height: 50px;
            line-height: 50px;
            text-align: center;
            border-radius: 50%;
            font-size: 1.5em;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 9998;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .back-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(0,0,0,0.25);
        }
        
        /* 響應式設計 */
        @media (max-width: 768px) {
            .header {
                padding: 40px 20px;
            }
            
            .header h1 {
                font-size: 1.6em;
            }
            
            .story-content {
                padding: 25px 20px;
            }
            
            .scene-image .placeholder {
                height: 200px;
            }
            
            .back-button {
                width: 45px;
                height: 45px;
                line-height: 45px;
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <!-- 載入進度條 -->
    <div class="progress-bar" id="progressBar">
        <div class="progress" id="progress"></div>
    </div>
    
    <!-- 返回按鈕 -->
    <a href="index.html" class="back-button" title="返回集數選擇">←</a>
    
    <div class="container">
        <div class="header">
            <div class="episode-tag" id="episodeTag">🎬 載入中...</div>
            <h1 id="episodeTitle">家庭故事集</h1>
            <div class="subtitle" id="episodeSubtitle">正在載入故事內容...</div>
        </div>
        
        <div class="story-content" id="storyContent">
            <div class="loading" style="text-align: center; padding: 60px 20px; color: #7f8c8d;">
                <div style="width: 50px; height: 50px; border: 4px solid #e0e0e0; border-top-color: #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
                <p>正在載入故事...</p>
            </div>
        </div>
        
        <div class="footer">
            <a href="index.html">🏠 返回集數選擇</a>
            <a href="../">🏡 返回主頁</a>
        </div>
    </div>

    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }
    </style>

    <script>
        // 配置資料
        let config = null;
        let currentEpisode = null;
        
        // 集數標題
        const episodeTitles = {
            1: '說走就走？先問媽媽！',
            2: '媽祖婆，我們來了！',
            3: '守護家人的智慧生活',
            4: '春節團圓',
            5: '棒球場攻略！',
            6: '水彈槍大戰！',
            7: '魔術方塊高手！',
            8: '小老師棉花糖！',
            9: '居家大改造！'
        };
        
        // 初始化
        document.addEventListener('DOMContentLoaded', async function() {
            await loadConfiguration();
            loadEpisodeFromURL();
        });
        
        // 載入配置
        async function loadConfiguration() {
            try {
                const response = await fetch('config.json');
                if (response.ok) {
                    config = await response.json();
                }
            } catch (error) {
                console.warn('載入配置時發生錯誤:', error);
            }
        }
        
        // 從 URL 載入集數
        function loadEpisodeFromURL() {
            const params = new URLSearchParams(window.location.search);
            const episodeId = params.get('episode');
            
            if (episodeId) {
                loadEpisode(parseInt(episodeId));
            } else {
                // 預設載入第一集
                loadEpisode(1);
            }
        }
        
        // 載入特定集數
        async function loadEpisode(episodeId) {
            currentEpisode = episodeId;
            
            try {
                // 載入故事 HTML
                const response = await fetch(`../episode${episodeId}/story.html`);
                if (!response.ok) {
                    throw new Error(`無法載入第 ${episodeId} 集`);
                }
                
                const htmlContent = await response.text();
                
                // 解析 HTML
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlContent, 'text/html');
                
                // 更新頁面標題
                const originalTitle = doc.querySelector('title')?.textContent || `第${episodeId}集`;
                document.title = `${originalTitle} - 家庭故事集`;
                
                // 更新 header
                document.getElementById('episodeTag').textContent = `🎬 第${episodeId}集`;
                document.getElementById('episodeTitle').textContent = episodeTitles[episodeId] || originalTitle;
                document.getElementById('episodeSubtitle').textContent = '點擊圖片可放大查看';
                
                // 提取主要內容
                let mainContent = doc.querySelector('.story-content') || 
                                  doc.querySelector('.container') || 
                                  doc.querySelector('body');
                
                if (mainContent) {
                    // 獲取選擇的圖片
                    const selectedImages = config?.selectedImages?.[`episode${episodeId}`] || [];
                    
                    // 處理內容
                    const processedContent = processContent(mainContent.innerHTML, episodeId, selectedImages);
                    document.getElementById('storyContent').innerHTML = processedContent;
                    
                    // 初始化漸進式圖片載入
                    initProgressiveLoading();
                }
                
            } catch (error) {
                console.error('載入故事時發生錯誤:', error);
                document.getElementById('storyContent').innerHTML = `
                    <div class="loading">
                        <p>載入故事時發生錯誤：${error.message}</p>
                        <a href="index.html" style="color: #667eea; margin-top: 20px; display: inline-block;">返回集數選擇</a>
                    </div>
                `;
            }
        }
        
        // 處理內容
        function processContent(html, episodeId, selectedImages) {
            // 如果有選擇的圖片，添加到內容開頭
            if (selectedImages && selectedImages.length > 0) {
                let imageGallery = '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 40px;">';
                
                selectedImages.forEach((imgPath, index) => {
                    imageGallery += `
                        <div style="border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative;">
                            <img src="${imgPath}" alt="場景 ${index + 1}" style="width: 100%; height: 200px; object-fit: cover;" loading="lazy" data-src="${imgPath}">
                            <div style="position: absolute; bottom: 10px; left: 10px; background: rgba(102, 126, 234, 0.9); color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.85em; backdrop-filter: blur(10px);">
                                場景 ${index + 1}
                            </div>
                        </div>
                    `;
                });
                
                imageGallery += '</div>';
                return imageGallery + html;
            }
            
            return html;
        }
        
        // 初始化漸進式圖片載入
        function initProgressiveLoading() {
            const images = document.querySelectorAll('img[data-src]');
            const total = images.length;
            let loaded = 0;
            
            const progressBar = document.getElementById('progressBar');
            const progress = document.getElementById('progress');
            
            function updateProgress() {
                loaded++;
                const percent = (loaded / total) * 100;
                progress.style.width = percent + '%';
                
                if (loaded === total) {
                    setTimeout(() => {
                        progressBar.classList.add('hidden');
                    }, 500);
                }
            }
            
            // 使用 Intersection Observer 實現懶載入
            const imageObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        const highResSrc = img.getAttribute('data-src');
                        
                        if (highResSrc) {
                            const tempImg = new Image();
                            tempImg.onload = function() {
                                img.src = highResSrc;
                                img.style.opacity = '1';
                                updateProgress();
                                observer.unobserve(img);
                            };
                            tempImg.onerror = function() {
                                updateProgress();
                                observer.unobserve(img);
                            };
                            tempImg.src = highResSrc;
                        } else {
                            updateProgress();
                            observer.unobserve(img);
                        }
                    }
                });
            }, {
                rootMargin: '100px 0px',
                threshold: 0.01
            });
            
            images.forEach(img => {
                img.style.opacity = '0';
                img.style.transition = 'opacity 0.5s ease';
                imageObserver.observe(img);
            });
            
            if (total === 0) {
                progressBar.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
