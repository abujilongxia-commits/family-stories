<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭故事集 - 閱讀中</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0;
            line-height: 1.8;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 60px rgba(0,0,0,0.3);
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 30px;
            text-align: center;
            position: relative;
        }
        
        .header .episode-tag {
            display: inline-block;
            background: rgba(255,255,255,0.3);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.9em;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header .subtitle {
            font-size: 1.1em;
            opacity: 0.95;
        }
        
        .story-content {
            padding: 30px 20px 60px;
        }
        
        /* 漫畫式排版 - 圖文並排 */
        .comic-scene {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
            align-items: flex-start;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.6s ease forwards;
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .comic-scene:nth-child(odd) .scene-image-container {
            order: 1;
        }
        
        .comic-scene:nth-child(odd) .scene-text-container {
            order: 2;
        }
        
        .comic-scene:nth-child(even) .scene-image-container {
            order: 2;
        }
        
        .comic-scene:nth-child(even) .scene-text-container {
            order: 1;
        }
        
        .scene-image-container {
            flex: 1;
            min-width: 280px;
            max-width: 450px;
            flex: 1 1 350px;
        }
        
        .scene-image {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            position: relative;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        
        .scene-image img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
        }
        
        .scene-image:hover img {
            transform: scale(1.02);
        }
        
        .scene-image .placeholder {
            width: 100%;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #636e72;
            font-size: 1.1em;
            background: linear-gradient(135deg, #dfe6e9 0%, #b2bec3 100%);
        }
        
        .scene-text-container {
            flex: 1;
            min-width: 250px;
            flex: 1 1 280px;
        }
        
        .scene-number {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            border-radius: 50%;
            font-size: 0.85em;
            margin-right: 8px;
        }
        
        .scene-title {
            font-size: 1.3em;
            color: #2d3436;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .scene-text {
            color: #333;
            font-size: 1em;
            line-height: 1.9;
        }
        
        .scene-text p {
            margin-bottom: 12px;
        }
        
        .scene-text .dialogue {
            background: #f8f9fa;
            padding: 15px 18px;
            border-radius: 12px;
            margin: 15px 0;
            border-left: 4px solid #667eea;
        }
        
        .scene-text .dialogue strong {
            color: #667eea;
            display: block;
            margin-bottom: 8px;
            font-size: 0.95em;
        }
        
        .scene-text .dialogue .text {
            color: #555;
            font-size: 1em;
        }
        
        /* 返回按鈕 */
        .back-button {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            z-index: 100;
            font-size: 0.95em;
            transition: all 0.3s ease;
        }
        
        .back-button:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.5);
        }
        
        /* 載入動畫 */
        .loading {
            text-align: center;
            padding: 60px 20px;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 進度條 */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.3);
            z-index: 1000;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .progress-bar.hidden {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        /* 彈出視窗 */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        
        .lightbox.active {
            display: flex;
        }
        
        .lightbox img {
            max-width: 95%;
            max-height: 95%;
            border-radius: 10px;
        }
        
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }
        
        /* RWD - 手機版 */
        @media (max-width: 600px) {
            .comic-scene {
                flex-direction: column !important;
            }
            
            .scene-image-container,
            .scene-text-container {
                max-width: 100% !important;
                flex: 1 1 100% !important;
                order: unset !important;
            }
            
            .header {
                padding: 40px 20px;
            }
            
            .header h1 {
                font-size: 1.6em;
            }
            
            .story-content {
                padding: 20px 15px 80px;
            }
            
            .scene-title {
                font-size: 1.15em;
            }
        }
    </style>
</head>
<body>
    <div class="progress-bar" id="progressBar">
        <div class="progress" id="progress"></div>
    </div>
    
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-button" style="position: static; margin-bottom: 20px; display: inline-block;">← 返回</a>
            <div class="episode-tag" id="episodeTag">🎬 載入中...</div>
            <h1 id="episodeTitle">家庭故事集</h1>
            <div class="subtitle" id="episodeSubtitle">點擊圖片可放大查看</div>
        </div>
        
        <div class="story-content" id="storyContent">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>正在載入故事...</p>
            </div>
        </div>
    </div>
    
    <a href="index.html" class="back-button">🏠 返回集數選擇</a>
    
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close">&times;</span>
        <img src="" alt="大圖" id="lightboxImg">
    </div>
    
    <script>
        // 集數標題
        const episodeTitles = {
            1: '說走就走？先問媽媽！',
            2: '媽祖婆，我們來了！',
            3: '守護家人的智慧生活',
            4: '春節團圓',
            5: '棒球場攻略！',
            6: '水彈槍大戰！',
            7: '魔術方塊高手！',
            8: '小老師棉花糖！',
            9: '居家大改造！'
        };
        
        // 初始化
        document.addEventListener('DOMContentLoaded', async function() {
            await loadConfiguration();
            loadEpisodeFromURL();
        });
        
        // 載入配置
        async function loadConfiguration() {
            try {
                const response = await fetch('./config.json');
                window.config = await response.json();
            } catch (error) {
                console.error('無法載入配置:', error);
                window.config = {};
            }
        }
        
        // 從 URL 載入集數
        function loadEpisodeFromURL() {
            const params = new URLSearchParams(window.location.search);
            const episodeId = params.get('episode');
            
            if (episodeId) {
                loadEpisode(parseInt(episodeId));
            }
        }
        
        // 載入指定集數
        async function loadEpisode(episodeId) {
            currentEpisode = episodeId;
            
            try {
                // 獲取集數 HTML
                const response = await fetch(`../dev/episode${episodeId}/story.html`);
                
                if (!response.ok) {
                    throw new Error(`無法載入第 ${episodeId} 集`);
                }
                
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // 更新標題
                const originalTitle = doc.querySelector('title')?.textContent || `第${episodeId}集`;
                document.title = `${originalTitle} - 家庭故事集`;
                
                document.getElementById('episodeTag').textContent = `🎬 第${episodeId}集`;
                document.getElementById('episodeTitle').textContent = episodeTitles[episodeId] || originalTitle;
                document.getElementById('episodeSubtitle').textContent = '點擊圖片可放大查看';
                
                // 獲取主要內容
                let mainContent = doc.querySelector('.story-content') || doc.querySelector('.container');
                
                if (mainContent) {
                    // 獲取選擇的圖片
                    const selectedImages = config?.selectedImages?.[`episode${episodeId}`] || [];
                    
                    // 處理內容 - 漫畫式排版
                    const processedContent = processContentComic(mainContent.innerHTML, episodeId, selectedImages);
                    document.getElementById('storyContent').innerHTML = processedContent;
                    
                    // 初始化漸進式圖片載入
                    initProgressiveLoading();
                    
                    // 初始化燈箱
                    initLightbox();
                }
                
            } catch (error) {
                console.error('載入故事時發生錯誤:', error);
                document.getElementById('storyContent').innerHTML = `
                    <div class="loading">
                        <p>載入故事時發生錯誤：${error.message}</p>
                        <a href="index.html" style="color: #667eea; margin-top: 20px; display: inline-block;">返回集數選擇</a>
                    </div>
                `;
            }
        }
        
        // 漫畫式內容處理
        function processContentComic(html, episodeId, selectedImages) {
            // 解析 HTML
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            
            // 找出所有場景
            const scenes = doc.querySelectorAll('.scene, .part-divider, .character-intro, .trip-info');
            
            let result = '';
            let imageIndex = 0;
            
            scenes.forEach((scene, index) => {
                // 獲取場景內容
                const sceneHTML = scene.innerHTML.trim();
                const sceneClass = scene.className || '';
                
                // 如果是分隔牌或介紹區塊，直接輸出
                if (sceneClass.includes('part-divider') || sceneClass.includes('character-intro') || sceneClass.includes('trip-info')) {
                    const title = scene.querySelector('h2, h3')?.textContent || '';
                    const content = scene.querySelector('p')?.textContent || '';
                    const items = scene.querySelectorAll('.item');
                    
                    let itemsHTML = '';
                    if (items.length > 0) {
                        itemsHTML = '<div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 15px;">';
                        items.forEach(item => {
                            itemsHTML += `<span style="background: white; padding: 8px 15px; border-radius: 20px; font-size: 0.9em; color: #636e72;">${item.textContent}</span>`;
                        });
                        itemsHTML += '</div>';
                    }
                    
                    result += `
                        <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; text-align: center; margin: 30px 0; border-radius: 15px;">
                            <h2 style="font-size: 1.4em; margin-bottom: 10px;">${title}</h2>
                            <p style="opacity: 0.9;">${content}</p>
                            ${itemsHTML}
                        </div>
                    `;
                    return;
                }
                
                // 獲取場景標題和編號
                const sceneNumber = scene.querySelector('.scene-number')?.textContent || (index + 1);
                const sceneTitle = scene.querySelector('p')?.textContent?.replace(/^\d+\s*/, '') || '';
                
                // 嘗試獲取對應圖片
                let imageHTML = '';
                if (imageIndex < selectedImages.length) {
                    const imgPath = selectedImages[imageIndex];
                    imageHTML = `
                        <div class="scene-image">
                            <img src="${imgPath}" alt="場景 ${sceneNumber}" loading="lazy" data-src="${imgPath}">
                        </div>
                    `;
                    imageIndex++;
                } else {
                    imageHTML = `
                        <div class="scene-image">
                            <div class="placeholder">📷 場景 ${sceneNumber}</div>
                        </div>
                    `;
                }
                
                // 輸出漫畫式區塊
                result += `
                    <div class="comic-scene" style="animation-delay: ${index * 0.1}s;">
                        <div class="scene-image-container">
                            ${imageHTML}
                        </div>
                        <div class="scene-text-container">
                            <div class="scene-title">
                                <span class="scene-number">${sceneNumber}</span>
                                ${sceneTitle}
                            </div>
                            <div class="scene-text">
                                ${sceneHTML}
                            </div>
                        </div>
                    </div>
                `;
            });
            
            return result;
        }
        
        // 初始化漸進式圖片載入
        function initProgressiveLoading() {
            const images = document.querySelectorAll('.scene-image img[loading="lazy"]');
            const total = images.length;
            let loaded = 0;
            
            const progressBar = document.getElementById('progressBar');
            const progress = document.getElementById('progress');
            
            function updateProgress() {
                loaded++;
                const percent = (loaded / total) * 100;
                progress.style.width = percent + '%';
                
                if (loaded === total) {
                    setTimeout(() => {
                        progressBar.classList.add('hidden');
                    }, 500);
                }
            }
            
            // 使用 Intersection Observer
            const imageObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        const highResSrc = img.getAttribute('data-src');
                        
                        if (highResSrc && highResSrc !== img.src) {
                            const tempImg = new Image();
                            tempImg.onload = function() {
                                img.src = highResSrc;
                                img.style.opacity = '1';
                                updateProgress();
                                observer.unobserve(img);
                            };
                            tempImg.onerror = function() {
                                updateProgress();
                                observer.unobserve(img);
                            };
                            tempImg.src = highResSrc;
                        } else {
                            updateProgress();
                            observer.unobserve(img);
                        }
                    }
                });
            }, {
                rootMargin: '100px 0px',
                threshold: 0.01
            });
            
            images.forEach(img => {
                img.style.opacity = '0';
                img.style.transition = 'opacity 0.5s ease';
                imageObserver.observe(img);
            });
            
            if (total === 0) {
                progressBar.classList.add('hidden');
            }
        }
        
        // 初始化燈箱
        function initLightbox() {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            const closeBtn = document.querySelector('.lightbox-close');
            
            document.querySelectorAll('.scene-image img').forEach(img => {
                img.style.cursor = 'pointer';
                img.addEventListener('click', function() {
                    const src = this.getAttribute('data-src') || this.src;
                    lightboxImg.src = src;
                    lightbox.classList.add('active');
                });
            });
            
            closeBtn.addEventListener('click', function() {
                lightbox.classList.remove('active');
            });
            
            lightbox.addEventListener('click', function(e) {
                if (e.target === lightbox) {
                    lightbox.classList.remove('active');
                }
            });
        }
    </script>
</body>
</html>
