<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭故事集</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f1a; color: #fff; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .header h1 { font-size: 1.5em; margin-bottom: 10px; }
        .nav { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 10px; background: rgba(255,255,255,0.05); }
        .nav-btn { padding: 8px 16px; background: rgba(255,255,255,0.1); border: none; border-radius: 8px; color: #fff; cursor: pointer; text-decoration: none; font-size: 14px; transition: all 0.3s; }
        .nav-btn:hover { background: rgba(255,255,255,0.2); }
        .nav-btn.active { background: #667eea; }
        #story { max-width: 900px; margin: 20px auto; padding: 0 20px; }
        .scene { position: relative; border-radius: 16px; overflow: hidden; margin-bottom: 30px; background: rgba(255,255,255,0.05); box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        .scene-img { width: 100%; aspect-ratio: 16/9; background: #1a1a2e; overflow: hidden; }
        .scene-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .scene-text { padding: 20px; }
        .scene-text p { margin-bottom: 12px; line-height: 1.8; color: rgba(255,255,255,0.9); font-size: 16px; }
        .dialogue { background: rgba(102,126,234,0.15); border-left: 4px solid #667eea; padding: 12px 16px; margin: 12px 0; border-radius: 0 12px 12px 0; }
        .dialogue .name { font-weight: bold; color: #667eea; margin-bottom: 6px; }
        .dialogue .text { color: rgba(255,255,255,0.95); line-height: 1.6; }
        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 90%; max-height: 90%; object-fit: contain; }
        .lightbox-close { position: absolute; top: 20px; right: 20px; font-size: 30px; color: #fff; cursor: pointer; background: none; border: none; }
        @media (max-width: 768px) {
            .header h1 { font-size: 1.2em; }
            .nav-btn { padding: 6px 12px; font-size: 12px; }
            .scene-text { padding: 15px; }
            .scene-text p { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="title">載入中...</h1>
        <nav class="nav" id="nav"></nav>
    </div>
    <main id="story"></main>
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close">×</button>
        <img src="" alt="">
    </div>
    <script>
        var titles = {
            1: '說走就走？先問媽媽！',
            2: '媽祖婆，我們來了！',
            3: '守護家人的智慧生活',
            4: '阿布吉與棉花糖的生日派對',
            5: '說走就走？先問媽媽！',
            6: '水彈槍大戰！',
            7: '第七集',
            8: '第八集',
            9: '第九集'
        };

        var episodeData = {};

        function getEpisodeId() {
            var params = new URLSearchParams(window.location.search);
            return parseInt(params.get('episode')) || 1;
        }

        function buildNav() {
            var episodes = [1,2,3,4,5,6,7,8,9];
            var html = '';
            var currentId = getEpisodeId();
            episodes.forEach(function(n) {
                var active = n === currentId ? 'active' : '';
                html += '<a href="story.html?episode=' + n + '" class="nav-btn ' + active + '">' + n + '</a>';
            });
            document.getElementById('nav').innerHTML = html;
        }

        function fixImagePath(src, episodeId) {
            if (!src || src.indexOf('http') === 0) return src;
            // Debug: log episodeId and src
            console.log('fixImagePath called with episodeId:', episodeId, 'src:', src);
            var base = 'https://abujilongxia-commits.github.io/family-stories/reader/episode' + episodeId + '/';
            // For episodes 3-9, images are in images/ subfolder
            if (episodeId >= 3 && src.indexOf('images/') === 0) {
                src = src.replace(/^images\//, '');
                base += 'images/';
            }
            var result = base + src.replace(/^\//, '');
            console.log('fixImagePath result:', result);
            return result;
        }

        function buildScene(episodeId, sceneEl) {
            var imgEl = sceneEl.querySelector('img');
            console.log('buildScene: episodeId=', episodeId, 'imgEl=', imgEl, 'src=', imgEl ? imgEl.src : 'null');
            var imgPath = imgEl ? fixImagePath(imgEl.src, episodeId) : '';
            var html = '<div class="scene">';
            if (imgPath) {
                html += '<div class="scene-img"><img src="' + imgPath + '" alt="" loading="lazy"></div>';
            }
            html += '<div class="scene-text">';
            var pEls = sceneEl.querySelectorAll('p');
            pEls.forEach(function(p) {
                var isDialogue = p.querySelector('.dialogue') !== null;
                var text = p.textContent.trim();
                if (!isDialogue && text) {
                    html += '<p>' + text + '</p>';
                }
            });
            var dialogueEls = sceneEl.querySelectorAll('.dialogue');
            dialogueEls.forEach(function(d) {
                var nameEl = d.querySelector('strong');
                var textEl = d.querySelector('.text');
                var name = nameEl ? nameEl.textContent.trim() : '';
                var text = textEl ? textEl.textContent.trim() : d.textContent.trim();
                if (text) {
                    html += '<div class="dialogue"><div class="name">' + name + '</div><div class="text">' + text + '</div></div>';
                }
            });
            html += '</div></div>';
            return html;
        }

        function renderEpisode(episodeId, doc) {
            var sceneEls = doc.querySelectorAll('.scene');
            console.log('renderEpisode: episodeId=', episodeId, 'sceneEls.length=', sceneEls.length);
            var html = '';
            sceneEls.forEach(function(scene, idx) {
                console.log('  scene', idx, ':', scene.outerHTML.substring(0, 100));
                html += buildScene(episodeId, scene);
            });
            document.getElementById('story').innerHTML = html;
            // Trigger lazy load by scrolling
            var imgs = document.querySelectorAll('.scene-img img');
            var loaded = 0;
            var maxConcurrent = 8;
            var queue = Array.prototype.slice.call(imgs);
            function tryNext() {
                while (queue.length > 0 && loaded < maxConcurrent) {
                    var img = queue.shift();
                    if (!img.complete || img.naturalWidth === 0) {
                        loaded++;
                        img.onload = function() { loaded--; tryNext(); };
                        img.onerror = function() { loaded--; tryNext(); };
                    }
                }
            }
            tryNext();
        }

        function loadEpisode(episodeId) {
            document.getElementById('title').textContent = titles[episodeId] || '第' + episodeId + '集';
            document.title = (titles[episodeId] || '第' + episodeId + '集') + ' - 家庭故事集';
            var url = 'https://abujilongxia-commits.github.io/family-stories/reader/episode' + episodeId + '/story.html';
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url + '?t=' + Date.now(), true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var parser = new DOMParser();
                    var doc = parser.parseFromString(xhr.responseText, 'text/html');
                    renderEpisode(episodeId, doc);
                } else {
                    document.getElementById('story').innerHTML = '<p style="text-align:center;padding:40px;color:#ff6b6b;">載入失敗：' + xhr.status + '</p>';
                }
            };
            xhr.onerror = function() {
                document.getElementById('story').innerHTML = '<p style="text-align:center;padding:40px;color:#ff6b6b;">網路錯誤</p>';
            };
            xhr.send();
        }

        document.querySelector('.lightbox-close').onclick = function() {
            document.getElementById('lightbox').classList.remove('active');
        };

        buildNav();
        loadEpisode(getEpisodeId());
    </script>
</body>
</html>
