<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭故事集 - 讀者版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            padding: 40px 20px;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.8em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.95;
        }
        
        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .episode-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
        }
        
        .episode-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .episode-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .episode-card:hover::before {
            opacity: 1;
        }
        
        .episode-image {
            width: 100%;
            height: 200px;
            overflow: hidden;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            position: relative;
        }
        
        .episode-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .episode-card:hover .episode-image img {
            transform: scale(1.1);
        }
        
        .episode-content {
            padding: 25px;
        }
        
        .episode-number {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            width: 40px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .episode-title {
            font-size: 1.4em;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .episode-desc {
            color: #7f8c8d;
            font-size: 0.95em;
            line-height: 1.6;
        }
        
        .episode-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ecf0f1;
            font-size: 0.85em;
            color: #95a5a6;
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .stat-icon {
            font-size: 1.2em;
        }
        
        .footer {
            text-align: center;
            color: white;
            padding: 30px 20px;
            margin-top: 40px;
        }
        
        .footer a {
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            background: rgba(255,255,255,0.2);
            border-radius: 30px;
            transition: background 0.3s ease;
            display: inline-block;
            margin: 10px;
        }
        
        .footer a:hover {
            background: rgba(255,255,255,0.3);
        }
        
        /* 載入動畫 */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 響應式設計 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }
            
            .episodes-grid {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
            }
            
            .episode-image {
                height: 180px;
            }
        }
        
        @media (max-width: 480px) {
            .episodes-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📖 家庭故事集</h1>
            <p>點擊下方卡片，開始閱讀我們的家庭故事</p>
        </div>
        
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>正在載入故事集...</p>
        </div>
        
        <div class="episodes-grid" id="episodesGrid" style="display: none;">
            <!-- 集數卡片將動態生成 -->
        </div>
        
        <div class="footer">
            <a href="../">🏠 返回主頁</a>
            <a href="../dev/image-selector.html">🖼️ 圖片選擇工具</a>
        </div>
    </div>

    <script>
        // 集數資料
        const episodes = [
            {
                id: 1,
                title: '說走就走？先問媽媽！',
                desc: '家庭日常中的溫馨互動與溝通',
                images: 30,
                scenes: 34
            },
            {
                id: 2,
                title: '媽祖婆，我們來了！',
                desc: '大甲媽祖遶境的文化體驗之旅',
                images: 30,
                scenes: 35
            },
            {
                id: 3,
                title: '守護家人的智慧生活',
                desc: '爸爸安裝 WiFi 智慧電源模組，讓家裡更安全',
                images: 17,
                scenes: 28
            },
            {
                id: 4,
                title: '春節團圓',
                desc: '農曆新年期間的溫馨團圓與傳統儀式',
                images: 29,
                scenes: 33
            },
            {
                id: 5,
                title: '棒球場攻略！',
                desc: '全家一起看棒球的歡樂時光',
                images: 29,
                scenes: 33
            },
            {
                id: 6,
                title: '水彈槍大戰！',
                desc: '刺激的戶外水彈槍對戰',
                images: 26,
                scenes: 33
            },
            {
                id: 7,
                title: '魔術方塊高手！',
                desc: '弟弟學習魔術方塊的成長故事',
                images: 25,
                scenes: 29
            },
            {
                id: 8,
                title: '小老師棉花糖！',
                desc: '棉花糖教家人搭帳篷的有趣經歷',
                images: 21,
                scenes: 29
            },
            {
                id: 9,
                title: '居家大改造！',
                desc: '爸爸用心改造家庭的溫馨故事',
                images: 26,
                scenes: 33
            }
        ];

        // 配置資料
        let config = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', async function() {
            await loadConfiguration();
            renderEpisodes();
        });

        // 載入配置
        async function loadConfiguration() {
            try {
                const response = await fetch('config.json');
                if (response.ok) {
                    config = await response.json();
                }
            } catch (error) {
                console.warn('載入配置時發生錯誤:', error);
            }
        }

        // 渲染集數卡片
        function renderEpisodes() {
            const grid = document.getElementById('episodesGrid');
            const loading = document.getElementById('loading');
            
            grid.innerHTML = episodes.map(ep => {
                const selectedImages = config?.selectedImages?.[`episode${ep.id}`] || [];
                const imageCount = selectedImages.length || ep.images;
                const firstImage = selectedImages[0] || `../episode${ep.id}/${String(ep.id).padStart(2, '0')}_scene.jpg`;
                
                return `
                    <div class="episode-card" onclick="openEpisode(${ep.id})">
                        <div class="episode-image">
                            <img src="${firstImage}" alt="${ep.title}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'200\' viewBox=\'0 0 200 200\'><rect width=\'200\' height=\'200\' fill=\'%23f5f7fa\'/><text x=\'100\' y=\'100\' font-family=\'Arial\' font-size=\'40\' fill=\'%23c3cfe2\' text-anchor=\'middle\' dominant-baseline=\'middle\'>📖</text></svg>'">
                        </div>
                        <div class="episode-content">
                            <div class="episode-number">${ep.id}</div>
                            <div class="episode-title">${ep.title}</div>
                            <div class="episode-desc">${ep.desc}</div>
                            <div class="episode-stats">
                                <div class="stat">
                                    <span class="stat-icon">🖼️</span>
                                    <span>${imageCount} 張圖片</span>
                                </div>
                                <div class="stat">
                                    <span class="stat-icon">📝</span>
                                    <span>${ep.scenes} 個場景</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            loading.style.display = 'none';
            grid.style.display = 'grid';
        }

        // 開啟集數
        function openEpisode(episodeId) {
            window.location.href = `story.html?episode=${episodeId}`;
        }
    </script>
</body>
</html>
