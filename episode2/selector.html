        const archiveImages = [];

        function renderImages(images, gridId, folder) {
            const grid = document.getElementById(gridId);
            images.forEach((img, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.name = img.name;
                card.dataset.folder = folder;
                card.onclick = function() {
                    this.classList.toggle('selected');
                    updateCount();
                };
                card.innerHTML = `
                    <div class="checkbox"></div>
                    <img src="${folder}/${img.name}" alt="${img.name}" onerror="this.src='https://via.placeholder.com/250x200?text=No+Image'">
                    <div class="card-content">
                        <div class="card-title">${img.name}</div>
                        <div class="card-prompt">${img.prompt}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateCount() {
            const count = document.querySelectorAll('.card.selected').length;
            document.getElementById('count').textContent = count;
        }

        function saveSelection() {
            const selected = [];
            document.querySelectorAll('.card.selected').forEach(card => {
                selected.push({
                    name: card.dataset.name,
                    folder: card.dataset.folder
                });
            });
            
            const json = JSON.stringify(selected, null, 2);
            const blob = new Blob([json], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'episode2_selection.json';
            a.click();
            
            alert(`已選擇 ${selected.length} 張圖片！\n下載的 JSON 檔案請告訴蝦蝦助手`);
        }

        // 載入圖片
        renderImages(newImages, 'new-grid', '.');
        
        // 載入庫存區圖片（如果有的話）
        fetch('./archive_2026-03-17_v2/')
            .then(r => r.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const links = doc.querySelectorAll('a[href$=".jpg"]');
                const archive = [];
                links.forEach(link => {
                    const name = link.getAttribute('href').split('/').pop();
                    if (name && name.endsWith('.jpg')) {
                        archive.push({name: name, prompt: '庫存區圖片'});
                    }
                });
                if (archive.length > 0) {
                    renderImages(archive, 'archive-grid', './archive_2026-03-17_v2');
                }
            })
            .catch(() => {});
    </script>
