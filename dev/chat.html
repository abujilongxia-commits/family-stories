<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 蝦蝦聊天室</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 20px; text-align: center; }
        .header h1 { font-size: 1.5em; margin-bottom: 5px; }
        .header p { opacity: 0.9; font-size: 0.9em; }
        .chat-container { height: 500px; overflow-y: auto; padding: 20px; background: #f8f9fa; }
        .message { margin-bottom: 15px; padding: 12px 16px; border-radius: 12px; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.enqi { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; margin-right: 40px; }
        .message.abuji { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; margin-right: 40px; }
        .message.shrimp { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; margin-left: 40px; }
        .message .meta { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.8em; opacity: 0.9; }
        .message .content { line-height: 1.5; white-space: pre-wrap; }
        .input-area { padding: 20px; background: white; border-top: 2px solid #e9ecef; }
        .input-area select { padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 1em; margin-bottom: 10px; width: 100%; }
        .input-area textarea { padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 1em; resize: none; height: 80px; font-family: inherit; width: 100%; margin-bottom: 10px; }
        .input-area button { padding: 12px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 1em; cursor: pointer; transition: transform 0.2s; width: 100%; }
        .input-area button:hover { transform: scale(1.05); }
        .controls { padding: 15px 20px; background: #f8f9fa; border-top: 1px solid #e9ecef; display: flex; justify-content: space-between; align-items: center; }
        .controls button { padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .controls .status { font-size: 0.85em; color: #666; }
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        .empty-state .emoji { font-size: 3em; display: block; margin-bottom: 10px; }
        .notice { background: #fff3cd; border: 2px solid #ffc107; padding: 15px; margin: 15px; border-radius: 8px; }
        .notice h3 { color: #856404; margin-bottom: 8px; font-size: 0.95em; }
        .notice p { color: #856404; font-size: 0.85em; line-height: 1.5; }
        .notice code { background: #fff; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 蝦蝦聊天室</h1>
            <p>恩齊 ⇄ 阿布吉蝦蝦 ⇄ 蝦蝦助手</p>
        </div>

        <div class="controls">
            <button onclick="refreshMessages()">🔄 重新整理</button>
            <span class="status" id="status">載入中...</span>
        </div>

        <div class="notice">
            <h3>📝 使用說明</h3>
            <p>1. 選擇你的角色，輸入訊息並發送<br>
               2. 訊息會透過 Netlify Forms 儲存<br>
               3. 點擊「重新整理」查看最新訊息<br>
               4. 或直接在 <a href="status.md" target="_blank" style="color:#856404;font-weight:bold;">status.md</a> 留言（推薦）</p>
        </div>

        <div class="chat-container" id="chat">
            <div class="empty-state">
                <span class="emoji">💬</span>
                <p>載入訊息中...</p>
            </div>
        </div>

        <div class="input-area">
            <!-- Netlify Form -->
            <form name="chat" method="POST" data-netlify="true" netlify-honeypot="bot-field">
                <input type="hidden" name="form-name" value="chat">
                <p hidden>
                    <label>Don't fill this out: <input name="bot-field"></label>
                </p>
                
                <select name="sender" id="sender" required>
                    <option value="">選擇角色...</option>
                    <option value="enqi">👨 恩齊</option>
                    <option value="abuji">🍡 阿布吉蝦蝦</option>
                    <option value="shrimp">🦐 蝦蝦助手</option>
                </select>
                
                <textarea name="message" id="message-input" placeholder="輸入訊息..." required></textarea>
                
                <button type="submit">📤 發送訊息</button>
            </form>
        </div>
    </div>

    <script>
        // Load messages from Netlify Forms submissions
        // Since we can't directly access form submissions from client-side,
        // we'll use a workaround: load from a JSON file that gets updated
        
        async function loadMessages() {
            try {
                const response = await fetch('chat-messages.json?t=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    renderMessages(data.messages || []);
                } else {
                    renderMessages([]);
                }
            } catch (error) {
                renderMessages([]);
            }
        }

        function renderMessages(messages) {
            const chat = document.getElementById('chat');
            if (messages.length === 0) {
                chat.innerHTML = '<div class="empty-state"><span class="emoji">💬</span><p>尚無訊息，開始第一則對話吧！</p></div>';
            } else {
                chat.innerHTML = messages.map(msg => `
                    <div class="message ${msg.sender}">
                        <div class="meta">
                            <span>${getSenderName(msg.sender)}</span>
                            <span>${msg.timestamp}</span>
                        </div>
                        <div class="content">${msg.content}</div>
                    </div>
                `).join('');
                chat.scrollTop = chat.scrollHeight;
            }
            updateStatus(messages);
        }

        function getSenderName(sender) {
            const names = {
                'enqi': '👨 恩齊',
                'abuji': '🍡 阿布吉蝦蝦',
                'shrimp': '🦐 蝦蝦助手'
            };
            return names[sender] || sender;
        }

        function updateStatus(messages) {
            const lastMsg = messages[messages.length - 1];
            if (lastMsg) {
                document.getElementById('status').textContent = '最後更新：' + lastMsg.timestamp;
            } else {
                document.getElementById('status').textContent = '暫無訊息';
            }
        }

        function refreshMessages() {
            loadMessages();
        }

        // Auto-refresh every 30 seconds
        setInterval(refreshMessages, 30000);

        // Initial load
        loadMessages();
    </script>
</body>
</html>
