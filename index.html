<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭故事集 - 首頁</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            color: white;
            max-width: 800px;
        }
        h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        p {
            font-size: 1.3em;
            margin-bottom: 40px;
            opacity: 0.95;
        }
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 18px 40px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: inline-block;
        }
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.3);
        }
        .episode-list {
            margin-top: 50px;
            text-align: left;
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .episode-list h2 {
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        .episode-list ul {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .episode-list li {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .episode-list li:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-3px);
        }
        .episode-list .ep-num {
            font-weight: bold;
            color: #fff;
            margin-right: 10px;
        }
        @media (max-width: 768px) {
            h1 { font-size: 2.5em; }
            p { font-size: 1.1em; }
            .btn { padding: 15px 30px; font-size: 1em; }
            .episode-list ul { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 家庭故事集</h1>
        <p>記錄我們家庭的溫馨時光與美好回憶</p>
        <div class="buttons">
            <a href="reader/" class="btn">📚 開始閱讀</a>
            <a href="dev/image-selector.html" class="btn btn-secondary">🖼️ 圖片選擇</a>
        </div>
        
        <div class="episode-list">
            <h2>📺 完整剧集列表</h2>
            <ul>
                <li><span class="ep-num">第 1 集</span>說走就走？先問媽媽！</li>
                <li><span class="ep-num">第 2 集</span>媽祖婆，我們來了！</li>
                <li><span class="ep-num">第 3 集</span>守護家人的智慧生活</li>
                <li><span class="ep-num">第 4 集</span>春節團圓</li>
                <li><span class="ep-num">第 5 集</span>棒球場攻略！</li>
                <li><span class="ep-num">第 6 集</span>水彈槍大戰！</li>
                <li><span class="ep-num">第 7 集</span>魔術方塊高手！</li>
                <li><span class="ep-num">第 8 集</span>小老師棉花糖！</li>
                <li><span class="ep-num">第 9 集</span>居家大改造！</li>
            </ul>
        </div>
    </div>
</body>
</html>
