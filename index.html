<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭故事集 - 首頁</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            color: white;
            max-width: 800px;
        }
        h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        p {
            font-size: 1.3em;
            margin-bottom: 40px;
            opacity: 0.95;
        }
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 18px 40px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: inline-block;
        }
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.3);
        }
        @media (max-width: 768px) {
            h1 { font-size: 2.5em; }
            p { font-size: 1.1em; }
            .btn { padding: 15px 30px; font-size: 1em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 家庭故事集</h1>
        <p>記錄我們家庭的溫馨時光與美好回憶</p>
        <div class="buttons">
            <a href="reader/" class="btn">📚 開始閱讀</a>
            <a href="reader/index.html" class="btn btn-secondary">📖 讀者版</a>
            <a href="dev/image-selector.html" class="btn btn-secondary">🖼️ 圖片選擇</a>
        </div>
    </div>
</body>
</html>
